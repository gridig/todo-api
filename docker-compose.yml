services:
  postgres:
    build:
      context: ./docker/timescaledb
      dockerfile: Dockerfile
    container_name: todo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_api
      # pgBackRest runs co-located in this container. Local dev uses a POSIX repo
      # on a volume — no S3 credentials needed. See docs/pgbackrest-implementation.md.
      PGBACKREST_STANZA: todo-api
      PGBACKREST_REPO_TYPE: posix
      PGBACKREST_REPO_PATH: /var/lib/pgbackrest
      PGBACKREST_RETENTION_FULL: '2'
      PGBACKREST_RETENTION_DIFF: '2'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_data:/var/lib/pgbackrest
      # initdb only runs on a fresh volume — `docker compose down -v` if you
      # need to re-bootstrap roles on an existing dev DB.
      - ./prisma/sql/bootstrap_roles.sql:/docker-entrypoint-initdb.d/01-bootstrap_roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: todo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://db_app:db_app_dev@postgres:5432/todo_api
      DATABASE_MIGRATE_URL: postgresql://db_admin:db_admin_dev@postgres:5432/todo_api
      # Secrets are read from the host environment (export them or define them
      # in .env). Fails compose-up with a clear error if unset — refuses to
      # silently ship placeholder secrets alongside NODE_ENV=production.
      # Generate keys: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your shell or .env (>=32 chars)}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set in your shell or .env (>=32 chars; required in production)}
      ENCRYPTION_KEYRING: ${ENCRYPTION_KEYRING:?ENCRYPTION_KEYRING must be set, e.g. k1:<base64-32-byte-key> (production rejects the committed placeholder)}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-k1}
      ENCRYPTION_BLIND_INDEX_KEY: ${ENCRYPTION_BLIND_INDEX_KEY:?ENCRYPTION_BLIND_INDEX_KEY must be set (base64 32-byte key)}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: info
      # REDIS_URL: redis://redis:6379  # Uncomment to enable Redis-backed (cross-instance) rate limiting
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  pgbackrest_data:
