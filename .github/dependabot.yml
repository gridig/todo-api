version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - '@types/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - '@typescript-eslint/*'
      jest:
        patterns:
          - jest
          - ts-jest
          - '@jest/*'
      prisma:
        patterns:
          - prisma
          - '@prisma/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The DB image's digest pin (timescale/timescaledb) lives in its own
  # directory — the docker ecosystem is not recursive, so without this entry
  # that base image gets no CVE bump PRs at all. Bumps stay manual per
  # AGENTS.md (docker is excluded from auto-merge).
  - package-ecosystem: docker
    directory: /docker/timescaledb
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
