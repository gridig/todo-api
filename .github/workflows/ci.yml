name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts calls env('DATABASE_URL') at load time; `prisma generate`
      # only parses the URL, never connects. Stub value is sufficient.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keep in lockstep with docker/timescaledb/Dockerfile — CI must test
        # against the same DB version prod runs, not whatever `latest` is today.
        image: timescale/timescaledb:2.27.1-pg16@sha256:87f39af0a38cb42e4add367d9dfad2087a53fe5c9b24b5bc0dc66bd204b0665f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL is set here (not in .env.test alone) because `prisma generate`
      # and `prisma migrate deploy` run before Jest's setup.ts loads .env.test.
      # JWT_SECRET, NODE_ENV, and CORS_* come from .env.test + __tests__/setup.ts.
      DATABASE_URL: postgresql://db_app:db_app_dev@localhost:5432/todo_api
      DATABASE_MIGRATE_URL: postgresql://db_admin:db_admin_dev@localhost:5432/todo_api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # GH Actions services can't mount initdb files, so bootstrap roles via psql.
      - name: Bootstrap DB roles
        run: psql "postgresql://postgres:postgres@localhost:5432/todo_api" -v ON_ERROR_STOP=1 -f prisma/sql/bootstrap_roles.sql
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run test:ci
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `prisma` (CLI) stays in `dependencies`: migrations run as Railway's
      # pre-deploy command (railway.json), which executes inside the prod image,
      # so the CLI must ship there. The prod tree currently has no high/critical
      # advisories, so we gate at `high` (tighten to `moderate` only once the
      # tree is clean at that level).
      - run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # pull-requests: write lets gitleaks post its findings summary as a PR comment
    # (otherwise it logs a non-fatal "Resource not accessible by integration" warning).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so a secret introduced in any commit on the PR (or on a
          # push to main) is caught, not just the tip. gitleaks scans the commit
          # range on PRs and the whole history on push.
          fetch-depth: 0
      # SOC 2 CC6.1 change-management control: fail the build if a credential
      # (JWT_SECRET, DATABASE_URL, tokens, keys) is ever committed. The workflow
      # run itself is the audit artifact. GITLEAKS_CONFIG pins our allowlist for
      # committed dev fixtures (.gitleaks.toml).
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Validates the TimescaleDB + pgBackRest image builds (apk pgbackrest resolves,
      # scripts copy). Config is validated at stanza-create runtime, not build time.
      - name: Build TimescaleDB + pgBackRest image
        run: docker build -f docker/timescaledb/Dockerfile docker/timescaledb/
