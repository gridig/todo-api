name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts calls env('DATABASE_URL') at load time; `prisma generate`
      # only parses the URL, never connects. Stub value is sufficient.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL is set here (not in .env.test alone) because `prisma generate`
      # and `prisma migrate deploy` run before Jest's setup.ts loads .env.test.
      # JWT_SECRET, NODE_ENV, and CORS_* come from .env.test + __tests__/setup.ts.
      DATABASE_URL: postgresql://db_app:db_app_dev@localhost:5432/todo_api
      DATABASE_MIGRATE_URL: postgresql://db_admin:db_admin_dev@localhost:5432/todo_api

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # GH Actions services can't mount initdb files, so bootstrap roles via psql.
      - name: Bootstrap DB roles
        run: psql "postgresql://postgres:postgres@localhost:5432/todo_api" -v ON_ERROR_STOP=1 -f prisma/sql/bootstrap_roles.sql
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run test:ci
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `prisma` (CLI) stays in `dependencies`: migrations run as Railway's
      # pre-deploy command (railway.json), which executes inside the prod image,
      # so the CLI must ship there. The prod tree currently has no high/critical
      # advisories, so we gate at `high` (tighten to `moderate` only once the
      # tree is clean at that level).
      - run: pnpm audit --prod --audit-level=high

  docker-images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Validates the TimescaleDB + pgBackRest image builds (apk pgbackrest resolves,
      # scripts copy). Config is validated at stanza-create runtime, not build time.
      - name: Build TimescaleDB + pgBackRest image
        run: docker build -f docker/timescaledb/Dockerfile docker/timescaledb/
